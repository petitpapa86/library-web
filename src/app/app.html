<header class="topbar">
  <a routerLink="/" class="brand">Library</a>
  @if (session.isSignedIn()) {
    <nav>
      <a routerLink="/search" routerLinkActive="active">Catalog</a>
      @if (session.isPatron()) {
        <a routerLink="/account" routerLinkActive="active">
          My account
          @if (notices.unread(); as unread) {
            <span class="tag tag-danger" [attr.aria-label]="unread + ' unread notices'">{{ unread }}</span>
          }
        </a>
      }
      @if (session.isLibrarian()) {
        <a routerLink="/desk" routerLinkActive="active">Desk</a>
      }
    </nav>
    <div class="who">
      <span>{{ session.userName() }}</span>
      <button type="button" class="link" (click)="session.signOut()">Sign out</button>
    </div>
  } @else {
    <div class="who"><button type="button" class="primary" (click)="session.signIn()">Sign in</button></div>
  }
</header>
<main>
  <router-outlet />
</main>
